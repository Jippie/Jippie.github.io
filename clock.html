<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jippie Clock</title>
    <link rel="stylesheet" href="./styles/clock.css">
    <script src="./scripts/clock.js" defer></script>
</head>
<body>
    <main>
        <div id="clock">00:00:00</div>
        <div id="clock-controls">
            <button id="dark-light" onclick="switchDark()" aria-label="Switch theme">
                <svg id="theme-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42
                            m11.3 11.3 1.42 1.42M2 12h2m16 0h2
                            M4.93 19.07l1.42-1.42m11.3-11.3
                            1.42-1.42"/>
                </svg>
            </button>
            <button id="background" aria-label="Change background" title="Change background" onclick="switchBackground()">
                <svg id="background-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="3" width="18" height="18" rx="3"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <path d="m21 15-5-5L5 21"/>
                </svg>
            </button>
            <button id="fullscreen" aria-label="Enter fullscreen" title="Enter fullscreen" onclick="toggleFullscreen()">
                <svg id="fullscreen-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3"/>
                </svg>
            </button>
        </div>
    </main>
</body>
</html>
