<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jippie Clock</title>
    <script>
        (() => {
            const cacheBust = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
            document.write(`<link rel="stylesheet" href="./styles/clock.css?reload=${cacheBust}">`);
            document.write(`<script src="./scripts/clock.js?reload=${cacheBust}" defer><\/script>`);
        })();
    </script>
</head>
<body>
    <main>
        <div id="clock">00:00:00</div>
        <div id="analog-clock" class="analog-clock" role="img" aria-label="Analog clock" hidden>
            <span id="hour-hand" class="analog-hand hour-hand"></span>
            <span id="minute-hand" class="analog-hand minute-hand"></span>
            <span id="second-hand" class="analog-hand second-hand"></span>
            <span class="analog-center"></span>
        </div>
        <time id="clock-date" hidden></time>
        <details id="settings-menu">
            <summary aria-label="Open settings" title="Open settings">
                <svg id="settings-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <g class="settings-gear">
                        <path d="M9.528 4.392 9.921 2.219 14.079 2.219 14.472 4.392 15.632 4.872 17.446 3.613 20.387 6.554 19.128 8.368 19.608 9.528 21.781 9.921 21.781 14.079 19.608 14.472 19.128 15.632 20.387 17.446 17.446 20.387 15.632 19.128 14.472 19.608 14.079 21.781 9.921 21.781 9.528 19.608 8.368 19.128 6.554 20.387 3.613 17.446 4.872 15.632 4.392 14.472 2.219 14.079 2.219 9.921 4.392 9.528 4.872 8.368 3.613 6.554 6.554 3.613 8.368 4.872 Z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </g>
                    <path class="settings-close" d="m6 6 12 12M18 6 6 18"/>
                </svg>
            </summary>
            <div class="settings-panel" aria-label="Clock settings">
                <label class="settings-toggle">
                    <span>Analog clock</span>
                    <input id="analog-toggle" type="checkbox">
                    <span class="toggle-track" aria-hidden="true"></span>
                </label>
                <label class="settings-toggle">
                    <span>Show date</span>
                    <input id="date-toggle" type="checkbox">
                    <span class="toggle-track" aria-hidden="true"></span>
                </label>
                <span class="settings-label" id="background-label">Background</span>
                <details class="custom-dropdown" id="background-dropdown">
                    <summary class="dropdown-trigger" aria-labelledby="background-label background-value">
                        <span class="dropdown-value" id="background-value">Default</span>
                    </summary>
                    <div class="dropdown-options" aria-label="Background options"></div>
                </details>
                <span class="settings-label" id="font-label">Font</span>
                <details class="custom-dropdown" id="font-dropdown">
                    <summary class="dropdown-trigger" aria-labelledby="font-label font-value">
                        <span class="dropdown-value" id="font-value">Monospace</span>
                    </summary>
                    <div class="dropdown-options" aria-label="Font options"></div>
                </details>
                <div class="settings-actions">
                    <button id="dark-light" onclick="switchDark()" aria-label="Switch theme" title="Switch theme">
                        <svg id="theme-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="12" r="4"/>
                            <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>
                        </svg>
                    </button>
                    <button id="fullscreen" aria-label="Enter fullscreen" title="Enter fullscreen" onclick="toggleFullscreen()">
                        <svg id="fullscreen-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3"/>
                        </svg>
                    </button>
                </div>
            </div>
        </details>
    </main>
</body>
</html>
